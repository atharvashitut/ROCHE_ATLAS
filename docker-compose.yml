services:
  api:
    build:
      context: ./backend
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-knowledge_base}
      TERRA_VISION_BASE_URL: ${TERRA_VISION_BASE_URL:-https://api.terra.example}
      TERRA_VISION_API_KEY: ${TERRA_VISION_API_KEY:-}
      TERRA_VISION_MODEL: ${TERRA_VISION_MODEL:-gpt-terra-vision}
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy

  ui:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  qdrant_data:
