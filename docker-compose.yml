name: itsm-copilot

services:
  api:
    build:
      context: ./backend
    environment:
      COPILOT_ADAPTER_MODE: ${COPILOT_ADAPTER_MODE:-mock}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-knowledge_base}
      TERRA_VISION_BASE_URL: ${TERRA_VISION_BASE_URL:-https://api.terra.example}
      TERRA_VISION_API_KEY: ${TERRA_VISION_API_KEY:-}
      TERRA_VISION_MODEL: ${TERRA_VISION_MODEL:-gpt-terra-vision}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      OAUTH_TOKEN_URL: ${OAUTH_TOKEN_URL:-}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    read_only: true
    user: "10001:10001"
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - copilot

  ui:
    build:
      context: ./frontend
    ports:
      - "5173:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - copilot

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - copilot

volumes:
  qdrant_data:
    name: itsm_copilot_qdrant_data

networks:
  copilot:
    name: itsm_copilot_network
